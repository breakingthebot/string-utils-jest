# Runs the library quality checks in GitHub Actions.
# Connects to: package.json, npm, Jest.
# Created: 2026-06-27
name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Run CLI smoke check
        run: npm run cli:smoke

      - name: Run coverage and package verification
        if: matrix.os == 'ubuntu-latest'
        run: npm run release:check
